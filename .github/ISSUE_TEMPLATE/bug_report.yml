name: Bug Report
description: Report a bug or unexpected behavior in context-archive (ctxa)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact commands and repository structure to trigger the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ctxa & Python Version
      placeholder: "ctxa 0.1.0, Python 3.12.4, Ubuntu 24.04"
    validations:
      required: true
