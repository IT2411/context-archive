[project]
name = "context-archive"
version = "1.0.1"
description = "Portable AI Project Context Compiler with incremental change journaling"
authors = [{ name = "Context Archive Contributors" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["ai", "context", "llm", "ast", "developer-tools", "mcp", "handoff"]
dependencies = [
    "pydantic (>=2.8.0,<3.0.0)",
    "typer (>=0.15.0,<1.0.0)",
    "rich (>=14.3.4,<15.0.0)",
    "pathspec (>=0.12.1,<1.0.0)",
    "tomli (>=2.0.1,<3.0.0) ; python_version < '3.11'",
]

[project.optional-dependencies]
tiktoken = ["tiktoken (>=0.7.0,<1.0.0)"]
mcp = ["mcp (>=1.0.0,<2.0.0)"]
all = [
    "tiktoken (>=0.7.0,<1.0.0)",
    "mcp (>=1.0.0,<2.0.0)",
]

[project.urls]
Homepage = "https://github.com/IT2411/context-archive"
Repository = "https://github.com/IT2411/context-archive"

[project.scripts]
ctxa = "context_archive.cli:app"

[tool.poetry]
packages = [{ include = "context_archive", from = "src" }]
include = ["src/context_archive/py.typed"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-randomly = "^3.15.0"
hypothesis = "^6.112.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
pre-commit = "^3.8.0"
tomli = "^2.0.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/fixtures/fixture_edge_cases"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "TCH",      # flake8-type-checking
    "PTH",      # flake8-use-pathlib
    "RUF",      # ruff-specific
    "S",        # flake8-bandit (security)
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/**" = ["S101", "B008"]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "B008"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["^tests/fixtures/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --ignore=tests/fixtures"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "bench_*.py"]
markers = [
    "unit: fast isolated unit tests",
    "integration: end-to-end filesystem and CLI workflow tests",
    "golden: deterministic golden-file comparison tests",
    "benchmark: performance and token budget benchmarks",
]

[tool.coverage.run]
source = ["src/context_archive"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
